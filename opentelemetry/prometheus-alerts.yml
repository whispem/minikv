groups:
  - name: minikv-slo
    interval: 30s
    # minikv 2.0.1 exports no latency histogram and no error counter (see the
    # families of GET /metrics), so there is no latency or error-rate alert.
    rules:
      - alert: MinikvNoHealthyVolumes
        expr: minikv_healthy_volumes < 1
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "minikv has no healthy volumes"
          description: "No healthy volumes detected for at least 2 minutes."
